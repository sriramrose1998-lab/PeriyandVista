<style>
:root{
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#EEF1F6; --border:#DDE3EC;
  --text:#102A43; --text-dim:#5A6B85;
  --accent:#102A43; --accent-2:#FFD700;
  --amber:#FFD700; --violet:#829AB1; --red:#E15759; --green:#59A14F; --teal:#334E68;
  --shadow: 0 1px 3px rgba(16,24,40,.07);
  --radius: 14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1626; --surface:#102A43; --surface-2:#16324F; --border:#26466B;
    --text:#F0F4F8; --text-dim:#9FB3C8;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1626; --surface:#102A43; --surface-2:#16324F; --border:#26466B;
  --text:#F0F4F8; --text-dim:#9FB3C8;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;}
.app{display:flex;flex-direction:column;min-height:100vh;}
.topchrome{position:sticky;top:0;z-index:20;background:var(--surface);}
.headerbar{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);}
.menubar{display:flex;align-items:center;gap:1px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);}
.menubar-item{padding:6px 10px;font-size:12px;font-weight:600;color:var(--text-dim);cursor:pointer;border-radius:6px;}
.menubar-item:hover{background:var(--surface-2);color:var(--text);}
.toolbar{display:flex;align-items:center;gap:4px;padding:6px 20px;background:var(--surface);border-bottom:1px solid var(--border);}
.tb-btn{border:1px solid transparent;background:none;font-size:13px;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--text-dim);}
.tb-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border);}
body.no-borders .card,body.no-borders .kpi{border-color:transparent;}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 4px;}
#presentExitBtn{display:none;position:fixed;top:14px;right:16px;z-index:999;background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);}
body.presentation-mode .headerbar,body.presentation-mode .menubar,body.presentation-mode .toolbar,body.presentation-mode .sidebar-nav,body.presentation-mode .topbar{display:none!important;}
body.presentation-mode #presentExitBtn{display:block;}
body.presentation-mode .content{padding-top:20px;max-width:100%;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;flex:none;}
.brand-name{font-weight:800;font-size:16px;letter-spacing:.1px;}
.brand-sub{color:var(--text-dim);font-size:11px;margin-top:1px;}
.body-row{display:flex;flex:1;min-height:0;}
.sidebar-nav{width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;transition:width .18s ease,flex-basis .18s ease,border-color .18s ease;}
.sidebar-nav.collapsed{width:0;flex-basis:0;border-right-color:transparent;overflow:hidden;}
.topnav{display:flex;flex-direction:column;gap:2px;padding:10px;}
.nav-sep{height:1px;width:100%;background:var(--border);margin:6px 0;flex:none;}
.tab-item{display:flex;align-items:center;gap:7px;padding:9px 12px;border-left:3px solid transparent;font-size:12.5px;font-weight:600;color:var(--text-dim);white-space:nowrap;cursor:pointer;border-radius:0 8px 8px 0;}
.tab-item svg{flex:none;opacity:.8;}
.tab-item:hover{color:var(--text);background:var(--surface-2);}
.tab-item.active{color:var(--accent);border-left-color:var(--accent);background:var(--surface-2);}
.tab-menu-btn{margin-left:auto;padding:0 3px;border-radius:4px;opacity:.55;font-weight:800;}
.tab-menu-btn:hover{opacity:1;background:var(--border);}
.ws-field:hover{background:var(--surface-2);}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;}
.page-title{font-weight:800;font-size:19px;margin-right:auto;}
.page-title span{display:block;font-weight:400;font-size:12px;color:var(--text-dim);margin-top:2px;}
.control{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--text-dim);}
select.control{cursor:pointer;color:var(--text);}
.btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{opacity:.9;color:#fff;}
.content{padding:20px 22px 40px;max-width:1400px;width:100%;margin:0 auto;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow);}
.kpi-label{font-size:11.5px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.kpi-value{font-size:25px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;}
.kpi-delta{font-size:12px;margin-top:6px;font-weight:600;display:flex;align-items:center;gap:4px;}
.kpi-delta.up{color:var(--green);} .kpi-delta.down{color:var(--red);}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.card-title{font-weight:700;font-size:13.5px;}
.card-sub{font-size:11.5px;color:var(--text-dim);}
.chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
canvas{max-width:100%;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:#fff;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;position:sticky;top:0;background:var(--accent);border-bottom:2px solid var(--accent-2);}
th:first-child{border-radius:6px 0 0 0;} th:last-child{border-radius:0 6px 0 0;}
td{padding:9px 10px;border-bottom:1px solid var(--border);}
tbody tr:nth-child(odd) td{background:var(--surface-2);}
tbody tr:nth-child(even) td{background:var(--surface);}
tr:hover td{background:color-mix(in srgb, var(--accent) 12%, var(--surface));}
tbody tr td:first-child{border-left:3px solid var(--accent);}
.status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
.status.ok{background:rgba(89,161,79,.14);color:var(--green);}
.status.warn{background:rgba(237,201,72,.22);color:#8a6d00;}
.status.bad{background:rgba(225,87,89,.14);color:var(--red);}
.table-wrap{max-height:320px;overflow:auto;}
.viz-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
.viz-item{aspect-ratio:1;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:grab;color:var(--text-dim);}
.viz-item:hover{border-color:var(--accent);color:var(--accent);}
.ai-box{display:flex;gap:8px;margin-bottom:14px;}
.ai-input{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text);}
.ai-input:focus{outline:none;border-color:var(--accent);}
.ai-suggest{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.ai-chip{font-size:11.5px;padding:5px 10px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;}
.ai-chip:hover{border-color:var(--accent);color:var(--accent);}
.legend-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--text-dim);}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
@media(max-width:900px){.grid,.grid3{grid-template-columns:1fr;}}
</style>
</head>

<script>
// ---------- theme ----------
const root=document.documentElement;
let theme='dark';
try{ theme = localStorage.getItem('dv-theme') || 'dark'; }catch(e){}
root.setAttribute('data-theme', theme);
function setTheme(t){
  theme=t;
  root.setAttribute('data-theme', theme);
  try{ localStorage.setItem('dv-theme', theme); }catch(e){}
  renderCharts();
}
document.getElementById('themeBtn').onclick=()=>setTheme(theme==='dark'?'light':'dark');
let navCollapsed=false;
try{ navCollapsed = localStorage.getItem('dv-nav-collapsed')==='1'; }catch(e){}
function applyNavCollapse(){
  const wrap=document.getElementById('sidebarNav');
  const btn=document.getElementById('navCollapseBtn');
  if(wrap) wrap.classList.toggle('collapsed', navCollapsed);
  if(btn){ btn.textContent = navCollapsed ? '☰▸' : '☰'; btn.title = navCollapsed ? 'Expand the sheet list' : 'Collapse the sheet list'; }
}
document.getElementById('navCollapseBtn').onclick=()=>{
  navCollapsed=!navCollapsed;
  try{ localStorage.setItem('dv-nav-collapsed', navCollapsed?'1':'0'); }catch(e){}
  applyNavCollapse();
};
applyNavCollapse();

// ---------- Toolbar, Presentation Mode, keyboard shortcuts ----------
let presentationMode=false;
function togglePresentationMode(){
  presentationMode=!presentationMode;
  document.body.classList.toggle('presentation-mode', presentationMode);
  const btn=document.getElementById('tbPresent');
  if(btn) btn.textContent = presentationMode ? '🖥️ Exit' : '🖥️ Present';
}
function quickSave(){
  const saveBtn=document.getElementById('saveReportBtn');
  if(saveBtn){ saveBtn.click(); return; }
  const status=document.createElement('div');
  status.textContent='Nothing to save here — switch to Report Builder to save a report.';
  status.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);z-index:999;font-size:12.5px;';
  document.body.appendChild(status);
  setTimeout(()=>status.remove(), 2200);
}
document.getElementById('tbNewSheet').onclick=addSheet;
document.getElementById('tbSave').onclick=quickSave;
document.getElementById('tbUndo').onclick=()=>alert('Undo history isn\'t tracked yet in this build.');
document.getElementById('tbRedo').onclick=()=>alert('Redo history isn\'t tracked yet in this build.');
document.getElementById('tbPresent').onclick=togglePresentationMode;
document.getElementById('presentExitBtn').onclick=togglePresentationMode;
document.addEventListener('keydown', e=>{
  if(e.key==='F7'){ e.preventDefault(); togglePresentationMode(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); quickSave(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='m'){ e.preventDefault(); addSheet(); }
  else if(e.key==='Escape'){ if(presentationMode) togglePresentationMode(); closeMenus(); }
});

function toggleFullscreen(){
  if(!document.fullscreenElement){
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  } else if(document.exitFullscreen){
    document.exitFullscreen();
  }
}

// ---------- Tableau-style menu bar ----------
function showToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);z-index:999;font-size:12.5px;max-width:80vw;';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function gotoPage(id){ currentPage=id; drawNav(); renderPage(); }
function exportCurrentAsImage(){
  const chart=charts.find(c=>c && c.canvas && typeof c.toBase64Image==='function');
  if(!chart){ showToast('No chart on this page to export — open a page with a chart first.'); return; }
  const a=document.createElement('a');
  a.href=chart.toBase64Image(); a.download=(sheetLabel(currentPage,'chart')||'chart').replace(/[^a-z0-9_\-]+/gi,'_')+'.png';
  document.body.appendChild(a); a.click(); a.remove();
}
function extractData(){
  if(!liveRaw){ showToast('No data loaded to extract.'); return; }
  const esc=v=>'"'+String(v===null||v===undefined?'':(v instanceof Date?v.toISOString().slice(0,10):v)).replace(/"/g,'""')+'"';
  const csv=[liveRaw.headers.map(esc).join(',')].concat(liveRaw.rows.map(r=>liveRaw.headers.map(h=>esc(r[h])).join(','))).join('\n');
  downloadBlob(csv, 'extract_'+liveRaw.filename.replace(/[^a-z0-9_\-]+/gi,'_')+'.csv', 'text/csv');
  showToast('Extracted '+liveRaw.rows.length.toLocaleString()+' rows to CSV.');
}
function publishWorkbook(){
  const payload=JSON.stringify({
    workbook:'PeriyandVista Analytics', exportedAt:new Date().toISOString(),
    sheets:sheets.map(s=>({id:s.id,label:s.label,hidden:s.hidden})),
    savedReports, storyPoints
  }, null, 2);
  downloadBlob(payload, 'periyandvista_workbook.json', 'application/json');
  showToast('Workbook downloaded — reports, story points and sheet layout included.');
}
function toggleAnalysisOverlay(kind){
  if(kind==='trend') wsTrend=!wsTrend; else wsForecast=!wsForecast;
  gotoPage('report');
  const on = kind==='trend'?wsTrend:wsForecast;
  if(!wsCols && !wsRows) showToast((kind==='trend'?'Trend line':'Forecast')+(on?' ON':' OFF')+' — now add a field to Columns/Rows (e.g. a date and a measure) to see it.');
  else showToast((kind==='trend'?'Trend line':'Forecast')+(on?' ON':' OFF')+' for the current worksheet chart.');
}
function toggleGrandTotals(){
  showGrandTotals=!showGrandTotals;
  rowPreviewOpen=true;
  gotoPage('report');
  showToast('Grand totals '+(showGrandTotals?'ON':'OFF')+' — see the Row Data Preview table.');
}
const MENUS = {
  Dashboard: [
    {label:'New Sheet', run:()=>addSheet()},
    {label:'Actions…', demo:'Dashboard actions (click a chart to filter others) aren\'t built yet.'},
    {label:'Format Dashboard…', demo:'Dashboard-wide formatting isn\'t built yet — use Format → Font… and Borders… for now.'},
    {label:'Export as Image', run:()=>exportCurrentAsImage()},
  ],
  Story: [
    {label:'Go to Story', run:()=>gotoPage('story')},
    {label:'New Story Point', run:()=>{ gotoPage('story'); storyPoints.push({title:'New point', caption:'Add your narrative for this point.', type:'trend'}); storyIndex=storyPoints.length-1; renderStory(); }},
    {label:'Format Story…', demo:'Story formatting isn\'t built yet — captions are editable directly on the Story page.'},

function renameSheet(id){
  const s=sheets.find(x=>x.id===id); if(!s) return;
  const name=prompt('Rename sheet:', s.label);
  if(name){ s.label=name; drawNav(); if(currentPage===id) renderPage(); }
}
function hideSheet(id){
  const visible=sheets.filter(s=>!s.hidden);
  if(visible.length<=1){ alert('At least one sheet must stay visible.'); return; }
  const s=sheets.find(x=>x.id===id); if(!s) return;
  s.hidden=true;
  if(currentPage===id) currentPage=sheets.find(x=>!x.hidden).id;
  drawNav(); renderPage();
}
function moveSheet(id, dir){
  const i=sheets.findIndex(x=>x.id===id);
  const j=i+dir;
  if(i<0||j<0||j>=sheets.length) return;
  [sheets[i],sheets[j]]=[sheets[j],sheets[i]];
  drawNav();
}
function duplicateSheet(id){
  const s=sheets.find(x=>x.id===id); if(!s) return;
  const copy={...s, id:'custom'+(sheetSeq++), label:s.label+' (Copy)', custom:true};
  const i=sheets.findIndex(x=>x.id===id);
  sheets.splice(i+1,0,copy);
  drawNav();
}
function deleteSheet(id){
  if(sheets.filter(s=>!s.hidden).length<=1){ alert('At least one sheet must remain.'); return; }
  if(!confirm('Delete this sheet? This cannot be undone.')) return;
  const i=sheets.findIndex(x=>x.id===id);
  if(i<0) return;
  sheets.splice(i,1);
  if(currentPage===id) currentPage=sheets.find(s=>!s.hidden).id;
  drawNav(); renderPage();
}
function sheetLabel(id, fallback){
  const s = sheets.find(x=>x.id===id);
  return s ? s.label : fallback;
}
function renderBlankSheet(){
  const s=sheets.find(x=>x.id===currentPage) || {label:'Sheet'};

}

const fmt=n=>{ n=Number(n)||0; const sign=n<0?'-':''; n=Math.abs(n);
  if(n>=1e7) return sign+(n/1e7).toFixed(2)+' Cr';
  if(n>=1e5) return sign+(n/1e5).toFixed(2)+' L';
  if(n>=1000) return sign+(n/1000).toFixed(1)+'K';
  return sign+Math.round(n);
};

function runVizAi(q){
  q=(q||'').toLowerCase();
  let t='bar';
  if(q.includes('trend')||q.includes('monthly')||q.includes('month')) t='line';
  else if(q.includes('ageing')||q.includes('histogram')) t='bar';
  else if(q.includes('share')||q.includes('split')) t='donut';
  else if(q.includes('top')) t='bar';
  builderType=t; document.getElementById('builderTypeSelect').value=t;
  buildBuilderChart(t);
}

function buildBuilderChart(type){
  const el=document.getElementById('builderCanvas'); if(!el) return;
  charts=charts.filter(c=>{ if(c.canvas && c.canvas.id==='builderCanvas'){ c.destroy(); return false; } return true; });
  const colors=chartColors(), grid=css('--border');
  const live=liveDataset;
  const categorical=['pie','donut','polarArea','radar'].includes(type);
  let labels, data1;
  if(live && categorical && live.byCat){ labels=live.byCat.labels; data1=live.byCat.values; }
  else if(live && !categorical && live.monthly){ labels=live.monthly.labels; data1=live.monthly.values; }
  else if(live && live.byCat){ labels=live.byCat.labels; data1=live.byCat.values; }
  else { labels = dropZones.x ? productCats : months; data1 = labels.map(()=>rnd(30,100)); }
  const legendName = live ? live.measureName : (dropZones.values || 'Sales');
  const map={
    bar:{type:'bar',data:{labels,datasets:[{label:legendName,data:data1,backgroundColor:colors[0],borderRadius:4}]}},
    stackedBar:{type:'bar',data:{labels,datasets:[{label:legendName,data:data1,backgroundColor:colors[0],stack:'s'},{label:'Budget',data:labels.map(()=>rnd(20,80)),backgroundColor:colors[3],stack:'s'}]}},
    line:{type:'line',data:{labels,datasets:[{label:legendName,data:data1,borderColor:colors[0],tension:.3}]}},
    area:{type:'line',data:{labels,datasets:[{label:legendName,data:data1,borderColor:colors[0],backgroundColor:colors[0]+'40',fill:true,tension:.3}]}},
    pie:{type:'pie',data:{labels,datasets:[{data:data1,backgroundColor:colors}]}},
    donut:{type:'doughnut',data:{labels,datasets:[{data:data1,backgroundColor:colors}]},options:{cutout:'60%'}},
    polarArea:{type:'polarArea',data:{labels,datasets:[{data:data1,backgroundColor:colors.map(c=>c+'AA')}]}},
    scatter:{type:'scatter',data:{datasets:[{label:legendName,data:data1.map((v,i)=>({x:i*10,y:v})),backgroundColor:colors[1]}]}},
    radar:{type:'radar',data:{labels,datasets:[{label:legendName,data:data1,borderColor:colors[2],backgroundColor:colors[2]+'33'}]}},
  };
  const cfg=map[type]||map.bar;
  cfg.options={plugins:{legend:{position:'bottom',labels:{boxWidth:8,usePointStyle:true}}},scales:['pie','donut','polarArea','radar'].includes(type)?{}:{x:{grid:{display:false}},y:{grid:{color:grid}}}};
  charts.push(new Chart(el,cfg));
}

      <button class="btn" id="filmNextBtn" style="padding:6px 8px;flex:none;">▶</button>
    </div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 340px;">
    <div class="card"><div class="card-head"><div style="display:flex;align-items:center;gap:8px;"><div class="card-title">${points[storyIndex].title}</div><button class="btn" id="renamePtBtn" style="padding:3px 8px;font-size:11px;">✎ Rename</button></div><span class="chip">Point ${storyIndex+1} of ${points.length}</span></div>
      <canvas id="storyChart" height="140"></canvas>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">Narrative</div><span class="chip" style="font-weight:400;">Add a caption</span></div>
      <textarea id="captionInput" style="width:100%;min-height:110px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;line-height:1.6;color:var(--text);background:var(--surface-2);font-family:inherit;">${points[storyIndex].caption}</textarea>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;">
        <button class="btn" id="storyPrev" ${storyIndex===0?'disabled':''}>← Previous</button>
        <button class="btn primary" id="storyNext" ${storyIndex===points.length-1?'disabled':''}>Next →</button>
        ${points.length>1?'<button class="btn" id="deletePtBtn">Delete Point</button>':''}
      </div>
    </div>
  </div>`;
  const colors=chartColors(), grid=css('--border');
  const p=points[storyIndex];
  let cfg;
  if(p.type==='trend'){
    const labels=live&&live.monthly?live.monthly.labels:months, vals=live&&live.monthly?live.monthly.values:salesSeries;
    cfg={type:'line',data:{labels,datasets:[{data:vals,borderColor:colors[0],backgroundColor:colors[0]+'33',fill:true,tension:.3}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{grid:{color:grid}}}}};
  } else if(p.type==='cat'){
    const labels=live&&live.byCat?live.byCat.labels:productCats, vals=live&&live.byCat?live.byCat.values:catValues;
    cfg={type:'doughnut',data:{labels,datasets:[{data:vals,backgroundColor:colors}]},options:{cutout:'60%',plugins:{legend:{position:'right',labels:{boxWidth:8,usePointStyle:true}}}}};
  } else if(p.type==='region'){
    cfg={type:'bar',data:{labels:regions.slice(1),datasets:[{data:regions.slice(1).map(()=>rnd(90,260)),backgroundColor:colors[1],borderRadius:5}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:grid}},y:{grid:{display:false}}}}};
  } else {
    cfg={type:'pie',data:{labels:['Healthy','Near Expiry','Dead Stock'],datasets:[{data:[72,19,9],backgroundColor:[colors[4],colors[3],colors[5]]}]},options:{plugins:{legend:{position:'bottom',labels:{boxWidth:8,usePointStyle:true}}}}};
  }
  try{ charts.push(new Chart(document.getElementById('storyChart'),cfg)); }catch(err){ console.error('Story chart failed:', err); }
  document.querySelectorAll('[data-pt]').forEach(el=>el.onclick=()=>{ storyIndex=Number(el.dataset.pt); renderStory(); });
  const prevBtn=document.getElementById('storyPrev'), nextBtn=document.getElementById('storyNext');
  if(prevBtn) prevBtn.onclick=()=>{ storyIndex--; renderStory(); };
  if(nextBtn) nextBtn.onclick=()=>{ storyIndex++; renderStory(); };
  const renameBtn=document.getElementById('renamePtBtn');
  if(renameBtn) renameBtn.onclick=()=>{
    const name=prompt('Name this story point:', points[storyIndex].title);
    if(name){ points[storyIndex].title=name; renderStory(); }
  };
  const addPtBtn=document.getElementById('addStoryPt');
  if(addPtBtn) addPtBtn.onclick=()=>{
    const name=prompt('Name for the new story point:', 'New point');
    if(!name) return;
    points.push({title:name, caption:'Add your narrative for this point.', type:'trend'});
    storyIndex=points.length-1;
    renderStory();
  };
  const delPtBtn=document.getElementById('deletePtBtn');
  if(delPtBtn) delPtBtn.onclick=()=>{
    if(points.length<=1) return;
    points.splice(storyIndex,1);
    storyIndex=Math.max(0, storyIndex-1);
    renderStory();
  };
  const captionEl=document.getElementById('captionInput');
  if(captionEl) captionEl.oninput=(e)=>{ points[storyIndex].caption=e.target.value; };
  const film=document.getElementById('filmstrip');
  const filmPrev=document.getElementById('filmPrevBtn'), filmNext=document.getElementById('filmNextBtn');
  if(filmPrev) filmPrev.onclick=()=>{ if(film) film.scrollBy({left:-170,behavior:'smooth'}); };
  if(filmNext) filmNext.onclick=()=>{ if(film) film.scrollBy({left:170,behavior:'smooth'}); };
}

function renderKPI(){
  pageTitle.innerHTML=`${sheetLabel('kpi','KPI Management')}<span>Targets, actuals and achievement across the business</span>`;
  const live=liveDataset;
  const salesActual = live ? live.total : 28750000;
  const salesTarget = Math.round(salesActual/1.08);
  const kpis=[
    {name:'Sales Target', target:salesTarget, actual:salesActual, fmt:v=>'₹'+fmt(v)},
    {name:'Inventory Turnover', target:8, actual:6.4, fmt:v=>v.toFixed(1)+'x'},
    {name:'Distributor Coverage', target:100, actual:87, fmt:v=>v+'%'},
    {name:'Budget Utilization', target:100, actual:93, fmt:v=>v+'%'},
    {name:'Expiry & Breakage', target:2, actual: live? (live.byCat? 3.1:2.4):2.4, fmt:v=>v.toFixed(1)+'%'},
  ];
  const rows=kpis.map(k=>{
    const achievement=Math.round((k.actual/k.target)*1000)/10;
    const variance=k.actual-k.target;
    const status = achievement>=95 ? 'ok' : achievement>=80 ? 'warn' : 'bad';
    return {...k, achievement, variance, status};
  });
  content.innerHTML=`
  <div class="kpi-row">${rows.map(r=>`
    <div class="kpi"><div class="kpi-label">${r.name}</div><div class="kpi-value" style="font-size:19px;">${r.fmt(r.actual)}</div>
    <div class="kpi-delta ${r.status==='ok'?'up':'down'}">${r.achievement}% of target</div></div>`).join('')}
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">KPI Scorecard</div><span class="chip">Green ≥95% · Amber ≥80% · Red &lt;80%</span></div>
    <div class="table-wrap"><table><thead><tr><th>KPI Name</th><th>Target</th><th>Actual</th><th>Variance</th><th>Achievement %</th><th>Status</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td style="font-weight:600;">${r.name}</td><td>${r.fmt(r.target)}</td><td>${r.fmt(r.actual)}</td><td style="color:${r.variance>=0?'var(--green)':'var(--red)'};font-weight:600;">${r.variance>=0?'+':''}${r.fmt(r.variance)}</td><td>${r.achievement}%</td>
    <td><span class="status ${r.status}">${r.status==='ok'?'Green':r.status==='warn'?'Amber':'Red'}</span></td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

function renderWhatIf(){
  pageTitle.innerHTML=`${sheetLabel('whatif','What-If Analysis')}<span>Simulate the impact of pricing, volume and cost changes</span>`;
  const live=liveDataset;
  const baseRevenue = live ? live.total : 28750000;
  const baseCostRatio = 0.72; // assumed cost as a share of revenue
  content.innerHTML=`
  <div class="card">
    <div class="card-head"><div class="card-title">Simulation Inputs</div><span class="chip">Baseline: ₹${fmt(baseRevenue)}</span></div>
    <div style="display:flex;flex-direction:column;gap:18px;max-width:520px;">
      ${[['salesInc','Sales Increase %',0,-30,50],['priceInc','Price Increase %',0,-20,30],['costRed','Cost Reduction %',0,0,30]].map(s=>`
      <div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${s[1]}</span><span id="${s[0]}Val" style="font-weight:700;color:var(--accent);">${s[2]}%</span></div>
        <input type="range" id="${s[0]}" min="${s[3]}" max="${s[4]}" value="${s[2]}" style="width:100%;">
      </div>`).join('')}
    </div>
  </div>
  <div class="kpi-row" style="margin-top:14px;">
    <div class="kpi"><div class="kpi-label">Revenue Impact</div><div class="kpi-value" id="whatifRevenue" style="font-size:19px;">₹${fmt(baseRevenue)}</div><div class="kpi-delta up" id="whatifRevenueDelta">+0.0%</div></div>
    <div class="kpi"><div class="kpi-label">Profit Impact</div><div class="kpi-value" id="whatifProfit" style="font-size:19px;">₹${fmt(baseRevenue*(1-baseCostRatio))}</div><div class="kpi-delta up" id="whatifProfitDelta">+0.0%</div></div>
    <div class="kpi"><div class="kpi-label">Budget Impact</div><div class="kpi-value" id="whatifBudget" style="font-size:19px;">₹${fmt(baseRevenue*baseCostRatio)}</div><div class="kpi-delta up" id="whatifBudgetDelta">+0.0%</div></div>
  </div>
  <div class="card" style="margin-top:14px;"><div class="card-head"><div class="card-title">Scenario Chart</div></div><canvas id="whatifChart" height="110"></canvas></div>`;
  const baseProfit=baseRevenue*(1-baseCostRatio), baseBudget=baseRevenue*baseCostRatio;
  const grid=css('--border');
  let chart=new Chart(document.getElementById('whatifChart'),{type:'bar',data:{labels:['Revenue','Profit','Cost'],datasets:[
    {label:'Baseline',data:[baseRevenue,baseProfit,baseBudget],backgroundColor:css('--border')},
    {label:'Scenario',data:[baseRevenue,baseProfit,baseBudget],backgroundColor:css('--accent-2')},
  ]},options:{plugins:{legend:{position:'bottom',labels:{boxWidth:8,usePointStyle:true}}},scales:{x:{grid:{display:false}},y:{grid:{color:grid}}}}});
  charts.push(chart);
  function recalc(){
    const salesInc=Number(document.getElementById('salesInc').value);
    const priceInc=Number(document.getElementById('priceInc').value);
    const costRed=Number(document.getElementById('costRed').value);
    document.getElementById('salesIncVal').textContent=salesInc+'%';
    document.getElementById('priceIncVal').textContent=priceInc+'%';
    document.getElementById('costRedVal').textContent=costRed+'%';
    const newRevenue = baseRevenue * (1+salesInc/100) * (1+priceInc/100);
    const newCostRatio = Math.max(0, baseCostRatio * (1-costRed/100));
    const newCost = newRevenue * newCostRatio;
    const newProfit = newRevenue - newCost;
    document.getElementById('whatifRevenue').textContent='₹'+fmt(newRevenue);
    document.getElementById('whatifProfit').textContent='₹'+fmt(newProfit);
    document.getElementById('whatifBudget').textContent='₹'+fmt(newCost);
    const pct=(a,b)=>b? Math.round((a-b)/b*1000)/10 : 0;
    const setDelta=(id,val)=>{ const el=document.getElementById(id); el.textContent=(val>=0?'+':'')+val+'%'; el.className='kpi-delta '+(val>=0?'up':'down'); };
    setDelta('whatifRevenueDelta', pct(newRevenue,baseRevenue));
    setDelta('whatifProfitDelta', pct(newProfit,baseProfit));
    setDelta('whatifBudgetDelta', pct(newCost,baseBudget));
    chart.data.datasets[1].data=[newRevenue,newProfit,newCost];
    chart.update();
  }
  ['salesInc','priceInc','costRed'].forEach(id=>document.getElementById(id).oninput=recalc);
}

// ---------- Multi-format report export ----------
function downloadBlob(content, filename, type){
  const blob=new Blob([content], {type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function currentReportName(){
  const el=document.getElementById('reportNameInput');
  return (el && el.value.trim()) || 'Untitled Report';
}
function getReportChartsData(){
  return canvasWidgets.map(w=>{
    const chart=charts.find(c=>c.canvas && c.canvas.id==='rw_'+w.id);
    let labels=[], series=[], image=null;
    if(chart && chart.data){
      labels=chart.data.labels||[];
      series=(chart.data.datasets||[]).map(ds=>({name:ds.label||w.title, data:ds.data||[]}));
      try{ image=chart.toBase64Image(); }catch(e){ image=null; }
    }
    return {title:w.title, labels, series, image};
  });
}
function exportReportJSON(){
  const name=currentReportName();
  const payload=JSON.stringify({name, exportedFrom:'PeriyandVista Analytics', exportedAt:new Date().toISOString(), widgets:canvasWidgets}, null, 2);
  downloadBlob(payload, name.replace(/[^a-z0-9_\-]+/gi,'_')+'.json', 'application/json');
}
function exportReportCSV(){
  const name=currentReportName();
  const chartsData=getReportChartsData();
  let csv='Chart,Label,Series,Value\n';
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
  if(!chartsData.length) csv+=esc('No charts in this report yet')+',,,\n';
  chartsData.forEach(c=>{
    (c.series.length?c.series:[{name:c.title,data:[]}]).forEach(s=>{
      c.labels.forEach((lab,i)=>{
        let val=s.data[i];
        if(val && typeof val==='object') val = val.y!==undefined?val.y:JSON.stringify(val);
        csv += [esc(c.title), esc(lab), esc(s.name), esc(val===undefined?'':val)].join(',')+'\n';
      });
    });
  });
  downloadBlob(csv, name.replace(/[^a-z0-9_\-]+/gi,'_')+'.csv', 'text/csv');
}
function exportReportExcel(){
  if(typeof XLSX==='undefined'){ alert('The Excel library did not load — check your connection and try again.'); return; }
  const name=currentReportName();
  const chartsData=getReportChartsData();
  const wb=XLSX.utils.book_new();
  const used={};
  (chartsData.length?chartsData:[{title:'Sheet1',labels:[],series:[]}]).forEach((c,i)=>{
    const rows=[['Label', ...(c.series.length?c.series.map(s=>s.name):['Value'])]];
    c.labels.forEach((lab,li)=>{
      rows.push([lab, ...(c.series.length?c.series.map(s=>{
        let v=s.data[li];
        if(v && typeof v==='object') v = v.y!==undefined?v.y:JSON.stringify(v);
        return v;
      }):[''])]);
    });
    if(!c.labels.length) rows.push(['No data']);
    let sheetName=(c.title||'Chart'+(i+1)).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28)||'Chart'+(i+1);
    let n=1; while(used[sheetName]){ sheetName=sheetName.slice(0,26)+'_'+(++n); }
    used[sheetName]=true;
    const ws=XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  XLSX.writeFile(wb, name.replace(/[^a-z0-9_\-]+/gi,'_')+'.xlsx');
}
function exportReportPDF(){
  if(!window.jspdf){ alert('The PDF library did not load — check your connection and try again.'); return; }
  const name=currentReportName();
  const chartsData=getReportChartsData();
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'pt', format:'a4'});
  doc.setFontSize(18); doc.setTextColor(16,42,67); doc.text(name, 40, 50);
  doc.setFontSize(10); doc.setTextColor(120); doc.text('PeriyandVista Analytics — exported '+new Date().toLocaleString(), 40, 68);
  let y=95;
  if(!chartsData.length){ doc.setFontSize(12); doc.setTextColor(80); doc.text('No charts in this report yet.', 40, y); }
  chartsData.forEach(c=>{
    if(y>650){ doc.addPage(); y=50; }
    doc.setFontSize(13); doc.setTextColor(16,42,67); doc.text(c.title, 40, y);
    y+=12;
    if(c.image){ try{ doc.addImage(c.image, 'PNG', 40, y, 320, 180); }catch(e){} y+=200; }
    else { y+=24; }
  });
  doc.save(name.replace(/[^a-z0-9_\-]+/gi,'_')+'.pdf');
}

function fieldIcon(type){
  if(type==='Number') return `<span style="width:16px;text-align:center;font-weight:800;color:var(--green);font-size:11px;">#</span>`;
  if(type==='Date') return `<span style="width:16px;text-align:center;">${icon('M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z')}</span>`;
  return `<span style="width:16px;text-align:center;font-style:italic;color:var(--accent);font-size:10px;font-weight:700;">Abc</span>`;
}
function fieldRow(f){
  return `<div class="ws-field" draggable="true" data-field="${f.name}" data-type="${f.type}" title="Drag to a shelf, double-click to auto-add, or use the buttons" style="display:flex;align-items:center;gap:6px;padding:5px 6px;font-size:12px;cursor:grab;border-radius:6px;">${fieldIcon(f.type)}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${f.name}</span><span data-addfield="${f.name}" data-target="cols" title="Add to Columns" style="cursor:pointer;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);flex:none;">Col</span><span data-addfield="${f.name}" data-target="rows" title="Add to Rows" style="cursor:pointer;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);flex:none;">Row</span></div>`;
}
function shelfPill(name){
  if(!name) return '';
  return `<span class="ws-pill" style="display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;">${name}<span data-remove-shelf="1" style="cursor:pointer;font-weight:800;">✕</span></span>`;
}
function marksBtn(key,label){
  const val=wsMarks[key];
  return `<button class="btn" data-marksbtn="${key}" title="${val?val:'Click to assign a field'}" style="flex-direction:column;padding:6px 2px;font-size:9.5px;line-height:1.3;${val?'border-color:var(--accent);color:var(--accent);':''}">
    <div style="font-size:14px;">${key==='color'?'🎨':key==='size'?'⬤':key==='label'?'🏷':key==='detail'?'☰':'💬'}</div>${label}
    ${val?`<div style="font-size:8px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${val}</div>`:''}
  </button>`;
}
function renderShowMeList(filterText){
  const list=document.getElementById('showMeList');
  if(!list) return;
  const q=(filterText||'').toLowerCase();
  const items=VIZ_GALLERY.filter(v=>v[1].toLowerCase().includes(q)||v[2].toLowerCase().includes(q));
  const autoRow = !q ? `<div class="showme-row" data-mark="auto" style="display:flex;gap:8px;align-items:flex-start;padding:7px 4px;cursor:pointer;border-radius:8px;border-bottom:1px solid var(--border);${!wsMarkOverride?'background:var(--surface-2);':''}">
    <div style="width:28px;height:28px;border-radius:8px;background:${css('--accent')};color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;">✨</div>
    <div style="min-width:0;"><div style="font-size:11.5px;font-weight:700;${!wsMarkOverride?'color:var(--accent);':''}">Automatic</div><div style="font-size:10px;color:var(--text-dim);">Let PeriyandVista pick the best chart for your fields.</div></div>
  </div>` : '';
  list.innerHTML = autoRow + items.map(v=>{
    const colorVar=SHOWME_COLOR[v[2]]||'--accent';
    const active=wsMarkOverride===v[0];
    return `<div class="showme-row" data-mark="${v[0]}" style="display:flex;gap:8px;align-items:flex-start;padding:7px 4px;cursor:pointer;border-radius:8px;border-bottom:1px solid var(--border);${active?'background:var(--surface-2);':''}">
      <div style="width:28px;height:28px;border-radius:8px;background:var(${colorVar});color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;">${SHOWME_SYM[v[0]]||'▤'}</div>
      <div style="min-width:0;"><div style="font-size:11.5px;font-weight:700;${active?'color:var(--accent);':''}">${v[1]}</div><div style="font-size:9.5px;color:var(${colorVar});font-weight:600;margin:1px 0;">${v[2]}</div><div style="font-size:10px;color:var(--text-dim);line-height:1.3;">${v[3]||''}</div></div>
    </div>`;
  }).join('') || `<div style="font-size:11px;color:var(--text-dim);padding:8px;">No matching chart types</div>`;
  list.querySelectorAll('.showme-row').forEach(row=>{
    row.onmouseenter=()=>{ if(row.dataset.mark!==(wsMarkOverride||'auto')) row.style.background='var(--surface-2)'; };
    row.onmouseleave=()=>{ if(row.dataset.mark!==(wsMarkOverride||'auto')) row.style.background=''; };
    row.onclick=()=>{ wsMarkOverride = row.dataset.mark==='auto'?null:row.dataset.mark; renderReportBuilder(); };
  });
}
function renderFieldList(filterText){
  const list=document.getElementById('wsFieldList');
  if(!list) return;
  const q=(filterText||'').toLowerCase();
  const fields=importColumns.filter(f=>f.name.toLowerCase().includes(q));
  list.innerHTML = fields.map(fieldRow).join('') || `<div style="font-size:11.5px;color:var(--text-dim);padding:6px;">No fields</div>`;
  list.querySelectorAll('.ws-field').forEach(el=>{
    el.ondragstart=e=>{ try{ e.dataTransfer.setData('text/plain', JSON.stringify({name:el.dataset.field,type:el.dataset.type})); }catch(err){} };
    el.ondblclick=(e)=>{
      if(e.target.closest('[data-addfield]')) return;
      const type=el.dataset.type;
      if(type==='Number'){ if(!wsRows) wsRows=el.dataset.field; else wsCols=el.dataset.field; }
      else { if(!wsCols) wsCols=el.dataset.field; else wsRows=el.dataset.field; }
      refreshShelves();
    };
  });
  list.querySelectorAll('[data-addfield]').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const name=btn.dataset.addfield;
      if(btn.dataset.target==='cols') wsCols=name; else wsRows=name;
      refreshShelves();
    };
  });
}
function bindShelfPillRemovers(){
  document.querySelectorAll('[data-remove-shelf]').forEach(x=>{
    x.onclick=(e)=>{
      e.stopPropagation();
      const shelf=x.closest('[data-shelf]');
      if(shelf.dataset.shelf==='cols') wsCols=null; else wsRows=null;
      refreshShelves();
    };
  });
}
function refreshShelves(){
  const c=document.getElementById('wsColsShelf'), r=document.getElementById('wsRowsShelf');
  if(c) c.innerHTML=shelfPill(wsCols);
  if(r) r.innerHTML=shelfPill(wsRows);
  bindShelfPillRemovers();
  renderWorksheet();
}
let rowPreviewOpen=false;

function getWorksheetChartConfig(detailed){
  if(!wsCols && !wsRows) return null;
  const rows = liveRaw ? liveRaw.rows : [];
  const colField = wsCols ? importColumns.find(f=>f.name===wsCols) : null;
  const rowField = wsRows ? importColumns.find(f=>f.name===wsRows) : null;
  const dims=[colField,rowField].filter(f=>f && f.type!=='Number');
  const meas=[colField,rowField].filter(f=>f && f.type==='Number');
  const colors=chartColors(), grid=css('--border');
  const legendOpt = detailed ? {display:true,position:'bottom',labels:{boxWidth:8,usePointStyle:true}} : {display:false};
  const scalesOpt = detailed ? {x:{grid:{display:false}},y:{grid:{color:grid}}} : {x:{display:false},y:{display:false}};
  let type=wsMarkOverride, cfg=null, title='';

  if(dims.length===1 && meas.length===1){
    const dim=dims[0], mea=meas[0];
    const map={};
    rows.forEach(r=>{
      let key=r[dim.name];
      if(dim.type==='Date'){ const d=new Date(key); key=isNaN(d)?'Unknown':d.toLocaleDateString('en-US',{month:'short',year:'2-digit'}); }
      key=(key===null||key===undefined||key==='')?'Unknown':String(key);
      map[key]=(map[key]||0)+(Number(r[mea.name])||0);
    });
    let entries=Object.entries(map);
    if(dim.type!=='Date') entries.sort((a,b)=>b[1]-a[1]);
    entries=entries.slice(0,20);
    const labels=entries.map(e=>e[0]), values=entries.map(e=>Math.round(e[1]));
    if(!type) type = dim.type==='Date' ? 'line' : 'bar';
    title=`${mea.name} by ${dim.name}`+(wsMarks.color?` (colored by ${wsMarks.color})`:'');
    if(type==='pie') cfg={type:'pie',data:{labels,datasets:[{data:values,backgroundColor:colors}]},options:{plugins:{legend:legendOpt}}};
    else if(type==='donut') cfg={type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:colors}]},options:{cutout:'60%',plugins:{legend:legendOpt}}};
    else if(type==='polarArea') cfg={type:'polarArea',data:{labels,datasets:[{data:values,backgroundColor:colors.map(c=>c+'AA')}]},options:{plugins:{legend:legendOpt}}};
    else if(type==='radar') cfg={type:'radar',data:{labels,datasets:[{data:values,borderColor:colors[0],backgroundColor:colors[0]+'33'}]},options:{plugins:{legend:legendOpt}}};
    else if(type==='line') cfg={type:'line',data:{labels,datasets:[{data:values,borderColor:colors[0],backgroundColor:colors[0]+'33',fill:false,tension:.3}]},options:{plugins:{legend:legendOpt},scales:scalesOpt}};
    else if(type==='area') cfg={type:'line',data:{labels,datasets:[{data:values,borderColor:colors[0],backgroundColor:colors[0]+'44',fill:true,tension:.3}]},options:{plugins:{legend:legendOpt},scales:scalesOpt}};
    else if(type==='colStacked'||type==='barStacked'||type==='col100'||type==='bar100'){
      const indexAxis=(type==='barStacked'||type==='bar100')?'y':'x';
      const pct=(type==='col100'||type==='bar100');
      const colorField=wsMarks.color?importColumns.find(f=>f.name===wsMarks.color && f.type!=='Number'):null;
      if(colorField){
        const colorVals=[...new Set(rows.map(r=>String(r[colorField.name]??'Unknown')))].slice(0,6);
        const datasets=colorVals.map((cv,ci)=>({
          label:cv,
          data:labels.map(lab=>{
            let sum=0;
            rows.forEach(r=>{
              let key=r[dim.name];
              if(dim.type==='Date'){ const d=new Date(key); key=isNaN(d)?'Unknown':d.toLocaleDateString('en-US',{month:'short',year:'2-digit'}); }
              key=(key===null||key===undefined||key==='')?'Unknown':String(key);
              if(key===lab && String(r[colorField.name]??'Unknown')===cv) sum+=Number(r[mea.name])||0;
            });
            return Math.round(sum);
          }),
          backgroundColor:colors[ci%colors.length], stack:'s'
        }));
        if(pct){
          labels.forEach((_,li)=>{
            const total=datasets.reduce((a,ds)=>a+ds.data[li],0)||1;
            datasets.forEach(ds=>{ ds.data[li]=Math.round(ds.data[li]/total*1000)/10; });
          });
        }
        cfg={type:'bar',data:{labels,datasets},options:{indexAxis,plugins:{legend:legendOpt},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid:{color:grid}}}}};
        title=`${mea.name} by ${dim.name}, stacked by ${colorField.name}`;
      } else {
        cfg={type:'bar',data:{labels,datasets:[{data:values,backgroundColor:colors[0],borderRadius:4}]},options:{indexAxis,plugins:{legend:legendOpt},scales:scalesOpt}};
        title=`${mea.name} by ${dim.name} (assign a Color field in Marks to actually stack it)`;
      }
    }
    else cfg={type:'bar',data:{labels,datasets:[{data:values,backgroundColor: wsMarks.color ? labels.map((_,i)=>colors[i%colors.length]) : colors[0],borderRadius:4}]},options:{plugins:{legend:legendOpt},scales:scalesOpt}};
  } else if(dims.length===1 && meas.length===0){
    const dim=dims[0];
    const map={};
    rows.forEach(r=>{ let key=r[dim.name]; key=(key===null||key===undefined||key==='')?'Unknown':String(key); map[key]=(map[key]||0)+1; });
    let entries=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,20);
    title=`Count of Records by ${dim.name}`;
    const donutLike=type==='donut'||type==='pie'||type==='polarArea';
    cfg={type: type==='pie'?'pie':type==='donut'?'doughnut':type==='polarArea'?'polarArea':'bar',
      data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:donutLike?colors:colors[0]}]},
      options:{plugins:{legend:legendOpt},scales:donutLike?{}:scalesOpt, cutout:type==='donut'?'60%':undefined}};
  } else if(dims.length===0 && meas.length===2){
    const [m1,m2]=meas;
    const pts=rows.slice(0,300).map(r=>({x:Number(r[m1.name])||0,y:Number(r[m2.name])||0}));
    title=`${m1.name} vs ${m2.name}`;
    cfg={type:'scatter',data:{datasets:[{label:title,data:pts,backgroundColor:colors[2]}]},options:{plugins:{legend:legendOpt},scales:scalesOpt}};
  } else if(dims.length===0 && meas.length===1){
    const m=meas[0];
    const total=rows.reduce((a,r)=>a+(Number(r[m.name])||0),0);
    title=`SUM(${m.name})`;
    cfg={type:'bar',data:{labels:[m.name],datasets:[{data:[Math.round(total)],backgroundColor:colors[0]}]},options:{plugins:{legend:{display:false}},scales:scalesOpt}};
  } else if(dims.length===2){
    const dim=dims[0];
    const map={};
    rows.forEach(r=>{ let key=r[dim.name]; key=(key===null||key===undefined||key==='')?'Unknown':String(key); map[key]=(map[key]||0)+1; });
    let entries=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,20);
    title=`Count of Records by ${dim.name}`;
    cfg={type:'bar',data:{labels:entries.map(e=>e[0]),datasets:[{data:entries.map(e=>e[1]),backgroundColor:colors[0]}]},options:{plugins:{legend:legendOpt},scales:scalesOpt}};
  }
  if(cfg && (wsTrend||wsForecast) && (cfg.type==='bar'||cfg.type==='line') && cfg.data.datasets.length===1 && cfg.data.labels){
    const ys=cfg.data.datasets[0].data.map(Number);
    const n=ys.length;
    if(n>=2 && ys.every(v=>!isNaN(v))){
      const mx=(n-1)/2, my=ys.reduce((a,b)=>a+b,0)/n;
      let num=0, den=0;
      ys.forEach((y,i)=>{ num+=(i-mx)*(y-my); den+=(i-mx)*(i-mx); });
      const slope=den?num/den:0, icpt=my-slope*mx;
      const fit=i=>Math.round(icpt+slope*i);
      const extra = wsForecast ? Math.max(2, Math.round(n/4)) : 0;
      for(let k=1;k<=extra;k++) cfg.data.labels.push('+'+k);
      const total=n+extra;
      if(wsTrend){
        cfg.data.datasets.push({type:'line',label:'Trend line',data:Array.from({length:total},(_,i)=>fit(i)),borderColor:colors[1],borderWidth:2,pointRadius:0,fill:false,tension:0});
        title+=' + trend';
      }
      if(wsForecast){
        cfg.data.datasets.push({type:'line',label:'Forecast',data:Array.from({length:total},(_,i)=> i<n-1 ? null : (i===n-1 ? ys[n-1] : Math.max(0,fit(i)))),borderColor:colors[3],borderDash:[6,4],borderWidth:2,pointRadius:3,fill:false,tension:0});
        title+=' + forecast';
      }
      cfg.options=cfg.options||{};
      cfg.options.plugins=cfg.options.plugins||{};
      cfg.options.plugins.legend={display:true,position:'bottom',labels:{boxWidth:8,usePointStyle:true}};
    }
  }
  return cfg ? {cfg, title} : null;
}
function totalsRowHtml(headers){
  if(!showGrandTotals || !liveRaw) return '';
  const cells=headers.map((h,i)=>{
    const col=importColumns.find(c=>c.name===h);
    if(col && col.type==='Number'){ const s=liveRaw.rows.reduce((a,r)=>a+(Number(r[h])||0),0); return `<td style="font-weight:800;">${fmt(s)}</td>`; }
    return `<td style="font-weight:800;">${i===0?'Grand Total':''}</td>`;
  });
  return `<tr style="border-top:2px solid var(--accent-2);">${cells.join('')}</tr>`;
}
function renderWorksheet(){
  const canvasEl=document.getElementById('worksheetCanvas');
  if(!canvasEl) return;
  charts=charts.filter(c=>{ if(c.canvas && c.canvas.id && c.canvas.id.indexOf('worksheetChartCanvas')===0){ c.destroy(); return false; } return true; });

    // live-data-aware renderer used in the Chart Gallery, full-size.
    canvasEl.innerHTML=`<div style="width:100%;height:100%;"><canvas id="worksheetChartCanvas"></canvas></div>`;

      <div style="font-weight:600;font-size:13px;">Add data to visualize</div>
      <div style="font-size:11.5px;margin-top:4px;">Double-click or drag fields from the data pane, or pick a type from Charts.</div>
    </div>`;
    return;
  }
  canvasEl.innerHTML=`<div style="width:100%;height:100%;"><canvas id="worksheetChartCanvas"></canvas></div>`;
  charts.push(new Chart(document.getElementById('worksheetChartCanvas'), JSON.parse(JSON.stringify(built.cfg))));
}

// ---------- AI command parsing (text + voice) ----------
const AI_TYPE_PATTERNS=[
  [/100%?\s*stacked\s*column/,'col100'],[/100%?\s*stacked\s*bar/,'bar100'],
  [/stacked\s*column/,'colStacked'],[/stacked\s*bar/,'barStacked'],
  [/clustered\s*column|column\s*chart/,'colClustered'],[/clustered\s*bar|\bbar\s*chart\b/,'barClustered'],
  [/smooth\s*line/,'lineSmooth'],[/multi\s*line/,'lineMulti'],[/\bline\s*chart\b|\bline\s*graph\b|\btrend\b/,'lineSingle'],
  [/100%?\s*stacked\s*area/,'area100'],[/stacked\s*area/,'areaStacked'],[/\barea\s*chart\b/,'area'],
  [/donut|doughnut/,'donut'],[/polar\s*area/,'polarArea'],[/\bpie\b/,'pie'],
  [/scatter/,'scatter'],[/bubble/,'bubble'],[/radar/,'radar'],[/histogram/,'histogram'],
  [/pareto/,'pareto'],[/funnel/,'funnel'],[/waterfall/,'waterfall'],[/gauge/,'gauge'],
  [/tree\s*map|treemap/,'treemap'],[/heat\s*map|heatmap/,'heatmap'],[/forecast/,'forecast'],
  [/matrix/,'matrix'],[/pivot/,'pivot'],[/geo|\bmap\b/,'geomap'],
  [/sankey/,'sankey'],[/network/,'network'],[/gantt/,'gantt'],[/calendar/,'calendar'],[/cohort/,'cohort'],
  [/stream\s*graph|streamgraph/,'streamgraph'],[/bump/,'bump'],[/bullet/,'bullet'],
  [/venn/,'venn'],[/chord/,'chord'],[/sunburst/,'sunburst'],[/beeswarm/,'beeswarm'],
  [/small\s*multiples/,'smallmultiples'],[/ternary/,'ternary'],[/hierarchy\s*table/,'hierarchytable'],
  [/super\s*table/,'supertables'],[/stock\s*trend/,'stocktrend'],
];
function bestFieldMatch(cols, q){
  let best=null, bestScore=0;
  cols.forEach(f=>{
    const name=f.name.toLowerCase();
    let score=0;
    if(q.includes(name)) score=name.length+10;
    else name.split(/\s+/).forEach(w=>{ if(w.length>2 && q.includes(w)) score+=w.length; });
    if(score>bestScore){ bestScore=score; best=f; }
  });
  return bestScore>0?best:null;
}
function parseAndApplyCommand(text){
  const q=(text||'').toLowerCase().trim();
  if(!q) return false;
  let matchedType=null;
  for(const [re,kind] of AI_TYPE_PATTERNS){ if(re.test(q)){ matchedType=kind; break; } }
  const numCols=importColumns.filter(f=>f.type==='Number');
  const dimCols=importColumns.filter(f=>f.type!=='Number');
  const measureField=bestFieldMatch(numCols,q);
  let dimField=null;
  const wiseMatch=q.match(/([a-z][a-z\s]{0,15}?)\s*wise/);
  if(wiseMatch) dimField=dimCols.find(f=>f.name.toLowerCase().includes(wiseMatch[1].trim()));
  if(!dimField) dimField=bestFieldMatch(dimCols,q);
  if(!matchedType && !measureField && !dimField) return false;
  if(measureField) wsRows=measureField.name;
  if(dimField) wsCols=dimField.name;
  if(matchedType) wsMarkOverride=matchedType;
  return {measureField, dimField, matchedType};
}
function runAiCommand(text){
  const status=document.getElementById('aiCommandStatus');
  try{
    if(!importColumns || !importColumns.length){
      if(status) status.textContent='No data loaded yet — upload a file on Data Import first, or wait for the sample data to finish loading.';
      return;
    }
    const result=parseAndApplyCommand(text);
    if(!result){
      if(status) status.textContent='Didn\'t catch a field or chart type in that — try naming a column (e.g. "Sales Value") or a chart type (e.g. "stacked bar").';
      return;
    }
    const parts=[];
    if(result.dimField) parts.push('by '+result.dimField.name);
    if(result.measureField) parts.push('measuring '+result.measureField.name);
    if(result.matchedType){ const meta=VIZ_GALLERY.find(v=>v[0]===result.matchedType); parts.push('as a '+(meta?meta[1]:result.matchedType)); }
    if(status) status.textContent='Built: '+(parts.join(', ')||'updated the view')+'.';
    renderReportBuilder();
  }catch(err){
    console.error('AI command failed:', err);
    if(status) status.textContent='Something went wrong building that — try rephrasing, or use the field buttons below instead.';
  }
}
function startVoiceCommand(){
  const status=document.getElementById('aiCommandStatus');
  const micBtn=document.getElementById('aiMicBtn');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ if(status) status.textContent='Voice commands need Chrome or Edge — this browser doesn\'t support speech recognition.'; return; }
  const rec=new SR();
  rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
  if(micBtn){ micBtn.textContent='🔴'; micBtn.style.borderColor='var(--red)'; micBtn.disabled=true; }
  if(status) status.textContent='Requesting microphone access…';
  rec.onstart=()=>{ if(status) status.textContent='🎙️ Listening — say something like "sales value by state stacked bar"…'; };
  rec.onresult=(e)=>{
    const said=e.results[0][0].transcript;
    const input=document.getElementById('aiCommandInput');
    if(input) input.value=said;
    if(status) status.textContent='Heard: "'+said+'" — building…';
    runAiCommand(said);
  };
  rec.onerror=(e)=>{
    if(!status) return;
    if(e.error==='not-allowed' || e.error==='permission-denied' || e.error==='service-not-allowed'){
      status.textContent='Microphone access was blocked. Allow microphone permission for this page in your browser\'s address-bar/site settings, then try again.';
    } else if(e.error==='no-speech'){
      status.textContent='Didn\'t hear anything — try again and speak right after the mic turns on.';
    } else if(e.error==='audio-capture'){
      status.textContent='No microphone was found on this device.';
    } else {
      status.textContent='Voice input error ('+e.error+') — try again or type your command instead.';
    }
  };
  rec.onend=()=>{ if(micBtn){ micBtn.textContent='🎤'; micBtn.style.borderColor=''; micBtn.disabled=false; } };
  try{ rec.start(); }catch(e){ if(status) status.textContent='Could not start the microphone.'; if(micBtn){ micBtn.textContent='🎤'; micBtn.style.borderColor=''; micBtn.disabled=false; } }
}

function nextWidgetPosition(){
  const n=canvasWidgets.length;
  return {x:20+(n%3)*40, y:20+(n%4)*36, w:260, h:180};
}
function renderCanvasWidgets(){
  const canvasEl=document.getElementById('reportCanvas');
  if(!canvasEl) return;
  charts=charts.filter(c=>{
    if(c.canvas && c.canvas.id && c.canvas.id.indexOf('rw_')===0){ c.destroy(); return false; }
    return true;
  });
  canvasEl.style.position='relative';
  if(!canvasWidgets.length){
    canvasEl.style.minHeight='200px';
    canvasEl.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;text-align:center;padding:10px;">Build a chart above and click "Add to Report ↓" — then drag it to move, drag the corner to resize.</div>';
    return;
  }
  const maxBottom=Math.max(220, ...canvasWidgets.map(w=>(w.y||0)+(w.h||180)+24));
  canvasEl.style.minHeight=maxBottom+'px';
  canvasEl.innerHTML=canvasWidgets.map(w=>`
    <div class="card" data-widget="${w.id}" style="position:absolute;left:${w.x||0}px;top:${w.y||0}px;width:${w.w||260}px;height:${w.h||180}px;padding:10px;display:flex;flex-direction:column;box-sizing:border-box;">
      <div data-widget-drag="${w.id}" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;cursor:move;user-select:none;">
        <span style="font-size:11.5px;font-weight:700;">${w.title}</span>
        <span data-remove="${w.id}" style="cursor:pointer;color:var(--text-dim);font-weight:800;padding:2px 6px;">✕</span>
      </div>
      <div style="flex:1;min-height:0;position:relative;"><canvas id="rw_${w.id}"></canvas></div>
      <div data-widget-resize="${w.id}" title="Drag to resize" style="position:absolute;right:2px;bottom:2px;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--border) 50%);border-radius:0 0 6px 0;"></div>
    </div>`).join('');
  canvasWidgets.forEach(w=>{
    try{
      if(w.cfg){ charts.push(new Chart(document.getElementById('rw_'+w.id), JSON.parse(JSON.stringify(w.cfg)))); }
      else { buildGalleryChart(w.kind, 'rw_'+w.id, true); }
    }catch(err){ console.error('Report widget chart failed:', w.id, err); }
  });
  canvasEl.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick=(e)=>{ e.stopPropagation(); canvasWidgets=canvasWidgets.filter(w=>w.id!==btn.dataset.remove); renderCanvasWidgets(); };
  });
  canvasEl.querySelectorAll('[data-widget-drag]').forEach(handle=>{
    handle.onmousedown=(e)=>{
      if(e.target.hasAttribute('data-remove')) return;
      e.preventDefault();
      const id=handle.dataset.widgetDrag;
      const w=canvasWidgets.find(x=>x.id===id);
      const el=canvasEl.querySelector(`[data-widget="${id}"]`);
      if(!w||!el) return;
      const startX=e.clientX, startY=e.clientY, origX=w.x||0, origY=w.y||0;
      function onMove(ev){
        w.x=Math.max(0, origX+(ev.clientX-startX));
        w.y=Math.max(0, origY+(ev.clientY-startY));
        el.style.left=w.x+'px'; el.style.top=w.y+'px';
      }
      function onUp(){ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); }
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    };
  });
  canvasEl.querySelectorAll('[data-widget-resize]').forEach(handle=>{
    handle.onmousedown=(e)=>{
      e.stopPropagation(); e.preventDefault();
      const id=handle.dataset.widgetResize;
      const w=canvasWidgets.find(x=>x.id===id);
      const el=canvasEl.querySelector(`[data-widget="${id}"]`);
      if(!w||!el) return;
      const startX=e.clientX, startY=e.clientY, origW=w.w||260, origH=w.h||180;
      function onMove(ev){
        w.w=Math.max(180, origW+(ev.clientX-startX));
        w.h=Math.max(120, origH+(ev.clientY-startY));
        el.style.width=w.w+'px'; el.style.height=w.h+'px';
      }
      function onUp(){
        document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp);
        const chart=charts.find(c=>c.canvas && c.canvas.id==='rw_'+id);
        if(chart && chart.resize) try{ chart.resize(); }catch(err){}
      }
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    };
  });
}
function renderSavedReportsList(){

  const names=Object.keys(savedReports);
  list.innerHTML = names.length ? names.map(n=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--surface-2);border-radius:6px;font-size:12px;flex-wrap:wrap;gap:4px;">

      <span style="display:flex;gap:7px;flex-wrap:wrap;">
        <span data-load-report="${n}" title="Open this report on the canvas to edit it" style="cursor:pointer;color:var(--accent);font-weight:600;">Edit</span>
        <span data-dup-report="${n}" title="Duplicate this report" style="cursor:pointer;color:var(--violet);font-weight:600;">Duplicate</span>
        <span data-export-report="${n}" title="Download this report as a .json file" style="cursor:pointer;color:var(--green);font-weight:600;">Export</span>
        <span data-schedule-report="${n}" title="Schedule this report" style="cursor:pointer;color:var(--amber);font-weight:600;">Schedule</span>
        <span data-del-report="${n}" title="Delete this report" style="cursor:pointer;color:var(--red);font-weight:600;">✕</span>
      </span>
    </div>`).join('') : `<div style="color:var(--text-dim);font-size:12px;">No saved reports yet — click "New Report", build a canvas, then Save Report.</div>`;
  list.querySelectorAll('[data-load-report]').forEach(el=>{
    el.onclick=()=>{
      canvasWidgets = JSON.parse(JSON.stringify(savedReports[el.dataset.loadReport]));
      const maxId = canvasWidgets.reduce((m,w)=>Math.max(m, parseInt((w.id||'w0').slice(1))||0), 0);
      widgetSeq = Math.max(widgetSeq, maxId+1);
      document.getElementById('reportNameInput').value = el.dataset.loadReport;
      renderCanvasWidgets();
    };
  });
  list.querySelectorAll('[data-dup-report]').forEach(el=>{
    el.onclick=()=>{
      const src=el.dataset.dupReport;
      let copyName=src+' (Copy)', n=2;
      while(savedReports[copyName]){ copyName=src+' (Copy '+n+')'; n++; }
      savedReports[copyName]=JSON.parse(JSON.stringify(savedReports[src]));
      persistReports();
      renderSavedReportsList();
    };
  });
  list.querySelectorAll('[data-export-report]').forEach(el=>{
    el.onclick=()=>{
      const rname=el.dataset.exportReport;
      const payload=JSON.stringify({name:rname, exportedFrom:'PeriyandVista Analytics', exportedAt:new Date().toISOString(), widgets:savedReports[rname]}, null, 2);
      const blob=new Blob([payload], {type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=rname.replace(/[^a-z0-9_\-]+/gi,'_')+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    };
  });
  list.querySelectorAll('[data-schedule-report]').forEach(el=>{
    el.onclick=()=>{
      const freq=prompt('Schedule "'+el.dataset.scheduleReport+'" — how often should it refresh/send?\n\nType: Daily, Weekly, or Monthly', 'Weekly');
      if(!freq) return;
      alert('Scheduled "'+el.dataset.scheduleReport+'" to refresh '+freq.trim()+'.\n\nActually emailing or refreshing on a timer needs a backend/server component, which this self-contained file doesn\'t have — this records the intent so the setting is ready to wire up.');
    };
  });
  list.querySelectorAll('[data-del-report]').forEach(el=>{
    el.onclick=()=>{ if(!confirm('Delete "'+el.dataset.delReport+'"? This cannot be undone.')) return; delete savedReports[el.dataset.delReport]; persistReports(); renderSavedReportsList(); };
  });
}

function cellText(v){
  if(v===null||v===undefined||v==='') return '';
  if(v instanceof Date) return v.toLocaleDateString();
  return v;
}
function looksLikeDateString(v){
  if(typeof v!=='string') return false;
  const t=v.trim();
  if(t==='') return false;
  if(/^-?\d+(\.\d+)?$/.test(t)) return false; // plain numbers aren't dates
  const parsed=Date.parse(t);
  return !isNaN(parsed);
}
function inferType(vals){
  if(!vals.length) return 'Text';
  if(vals.every(v=>v instanceof Date)) return 'Date';
  if(vals.every(v=>typeof v==='number')) return 'Number';
  if(vals.every(v=>looksLikeDateString(v))) return 'Date';
  if(vals.every(v=>v!=='' && !isNaN(v))) return 'Number';
  return 'Text';
}
function handleUpload(file){
  const name=file.name, lower=name.toLowerCase();
  document.getElementById('uploadStatus').textContent='Reading '+name+'…';
  if(lower.endsWith('.csv')){
    Papa.parse(file,{header:true,dynamicTyping:true,skipEmptyLines:true,
      complete:res=>applyParsedData(res.meta.fields||[], res.data, name),
      error:err=>{ document.getElementById('uploadStatus').textContent='Could not read file: '+err.message; }
    });
  } else if(lower.endsWith('.xlsx')||lower.endsWith('.xls')){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'array', cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
        const headers=rows.length?Object.keys(rows[0]):[];
        applyParsedData(headers, rows, name);
      }catch(err){ document.getElementById('uploadStatus').textContent='Could not read file: '+err.message; }
    };
    reader.readAsArrayBuffer(file);
  } else {
    document.getElementById('uploadStatus').textContent='Unsupported file type — please upload a .csv or .xlsx file.';
  }
}
function applyParsedData(headers, rows, filename){
  headers=headers.filter(Boolean);
  importColumns = headers.map(h=>{
    const vals=rows.map(r=>r[h]).filter(v=>v!==null && v!==undefined && v!=='');
    const nullCount=rows.length-vals.length;
    const type=inferType(vals.slice(0,100));
    return {
      name:h, type, required:nullCount===0,
      rule: type==='Number'?'Numeric range check':type==='Date'?'Valid date format':'Non-empty text',
      dup:false, status: nullCount>0?'warn':'ok', issues: nullCount
    };
  });
  document.getElementById('validationTitle').textContent='Data Validation — '+filename;
  document.getElementById('validationBody').innerHTML=importColumns.map(validationRow).join('');
  rebindValidationRows();
  updateValidationSummary();
  document.getElementById('uploadStatus').textContent=`Loaded ${rows.length.toLocaleString()} rows, ${headers.length} columns from ${filename}.`;
  document.getElementById('importHistoryBody').insertAdjacentHTML('afterbegin',
    `<tr><td>${filename}</td><td>${rows.length.toLocaleString()}</td><td><span class="status ok">Imported</span></td></tr>`);
  liveRaw={headers, rows, filename};
  try{ buildLiveDataset(rows, filename); applyGlobalFilters(); }catch(err){ console.error('buildLiveDataset failed:', err); liveDataset=null; }
  try{ refreshPreviewWrap(); }catch(err){ console.error('refreshPreviewWrap failed:', err); }
}

function aggValues(vals, agg){
  if(!vals.length) return 0;
  if(agg==='avg') return vals.reduce((a,b)=>a+b,0)/vals.length;
  if(agg==='count') return vals.length;
  if(agg==='min') return Math.min(...vals);
  if(agg==='max') return Math.max(...vals);
  return vals.reduce((a,b)=>a+b,0);
}
function buildLiveDataset(rows, filename, opts){
  const measureCol = opts
    ? importColumns.find(c=>c.name===opts.measureCol)
    : (importColumns.find(c=>c.type==='Number' && /amount|sales|revenue|value|qty|quantity|total/i.test(c.name)) || importColumns.find(c=>c.type==='Number'));
  if(!measureCol){ liveDataset=null; return; }
  const dateCol = opts ? (opts.dateCol ? importColumns.find(c=>c.name===opts.dateCol) : null) : importColumns.find(c=>c.type==='Date');
  const catCol = opts ? (opts.catCol ? importColumns.find(c=>c.name===opts.catCol) : null)
    : (importColumns.find(c=>c.type==='Text' && /region/i.test(c.name)) || importColumns.find(c=>c.type==='Text' && /categ|product|brand|type/i.test(c.name)) || importColumns.find(c=>c.type==='Text'));
  const agg = (opts && opts.agg) || 'sum';
  const measure=measureCol.name;
  let monthly=null;
  if(dateCol){
    const order=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const map={};
    rows.forEach(r=>{
      const d=new Date(r[dateCol.name]);
      if(isNaN(d)) return;
      const key=order[d.getMonth()];
      (map[key]=map[key]||[]).push(Number(r[measure])||0);
    });
    const labels=order.filter(m=>map[m]!==undefined);
    if(labels.length) monthly={labels, values:labels.map(l=>Math.round(aggValues(map[l],agg)))};
  }
  let byCat=null;
  if(catCol){
    const map={};
    rows.forEach(r=>{
      const key=String(r[catCol.name]??'Unknown');
      (map[key]=map[key]||[]).push(Number(r[measure])||0);
    });
    const labels=Object.keys(map).sort((a,b)=>aggValues(map[b],agg)-aggValues(map[a],agg)).slice(0,8);
    byCat={labels, values:labels.map(l=>Math.round(aggValues(map[l],agg))), field:catCol.name};
  }
  const measureVals=rows.map(r=>Number(r[measure])||0);
  const total = agg==='count' ? rows.length : Math.round(aggValues(measureVals, agg));
  liveDataset={measureName:measure, monthly, byCat, total, rowCount:rows.length, filename,
    dateColName: dateCol?dateCol.name:null, catColName: catCol?catCol.name:null, agg};
}

  </div>
  <div class="grid3" style="margin-top:14px;">
    <div class="card"><div class="card-title">Session Management</div><div class="card-sub" style="margin-top:6px;">42 active sessions · JWT, 30 min idle timeout</div></div>
    <div class="card"><div class="card-title">Database Backup</div><div class="card-sub" style="margin-top:6px;">Last backup: today 02:00 · Daily schedule</div></div>
    <div class="card"><div class="card-title">Application Settings</div><div class="card-sub" style="margin-top:6px;">Theme, notification & locale defaults</div></div>
  </div>`;
  const addUserBtn=document.getElementById('addUserBtn');
  if(addUserBtn) addUserBtn.onclick=()=>{
    const name=prompt('New user\'s name:');
    if(!name) return;
    alert('Would create a login for "'+name+'" and assign a role — wire this up to your user directory / auth backend to make it real.');
  };
}

document.getElementById('exportBtn').onclick=()=>alert('Export PDF / Excel — wire up to your backend export service.');
function applyGlobalFilters(){
  if(!liveRaw) return;
  const regionSel=document.getElementById('regionFilter'), dateSel=document.getElementById('dateFilter');
  const regionVal=regionSel?regionSel.value:'All Regions';
  const dateVal=dateSel?dateSel.value:'This quarter';
  let rows=liveRaw.rows;
  const zoneCol=importColumns.find(f=>f.type==='Text' && /zone|region/i.test(f.name));
  if(zoneCol && regionVal && regionVal!=='All Regions'){
    rows=rows.filter(r=>String(r[zoneCol.name]||'').toLowerCase()===regionVal.toLowerCase());
  }
  const dateCol=importColumns.find(f=>f.type==='Date');
  if(dateCol){
    const monthsBack={'Last 30 days':1,'This quarter':3,'Year to date':12,'Last 12 months':12}[dateVal] ?? 12;
    const parsed=rows.map(r=>({r,d:new Date(r[dateCol.name])})).filter(x=>!isNaN(x.d));
    if(parsed.length){
      const maxTime=Math.max(...parsed.map(x=>x.d.getTime()));
      const cutoff=new Date(maxTime); cutoff.setMonth(cutoff.getMonth()-monthsBack);
      rows=parsed.filter(x=>x.d>=cutoff).map(x=>x.r);
    }
  }
  const opts = liveDataset ? {measureCol:liveDataset.measureName, dateCol:liveDataset.dateColName||'', catCol:liveDataset.catColName||'', agg:liveDataset.agg} : undefined;
  buildLiveDataset(rows, liveRaw.filename, opts);
}
document.getElementById('regionFilter').onchange=()=>{ applyGlobalFilters(); renderPage(); };
document.getElementById('dateFilter').onchange=()=>{ applyGlobalFilters(); renderPage(); };

// Prevent the browser's default "open file" behavior when a drag lands
// anywhere outside the actual dropzone — this is what made drag & drop feel broken.
window.addEventListener('dragover', e=>e.preventDefault());
window.addEventListener('drop', e=>{ if(!e.target.closest('#dropzone')) e.preventDefault(); });

drawMenuBar();
drawNav();
